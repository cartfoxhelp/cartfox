<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CartFox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 450px; margin: 60px auto; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
        <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
        <form id="signupForm">
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Full Name</label>
                <input type="text" id="signupName" required placeholder="John Doe" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Email Address</label>
                <input type="email" id="signupEmail" required placeholder="name@example.com" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Password</label>
                <input type="password" id="signupPassword" required placeholder="********" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;">
            </div>
            <button type="submit" class="buy-btn" style="width:100%; border:none; cursor:pointer;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
            Already have an account? <a href="login.html" style="color: #ff6b00; font-weight: bold;">Login here</a>
        </p>
    </div>
    <script src="auth.js"></script>
</body>
</html>
