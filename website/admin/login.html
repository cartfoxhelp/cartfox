<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CartFox</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
    <script src="login.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">🦊 CartFox Admin</h1>
            <p class="login-subtitle">Please sign in to continue</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" value="admin@cartfox.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" value="admin123">
                </div>
                <div id="error" class="error-message hidden"></div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    Sign In
                    <span class="spinner hidden" id="loginSpinner"></span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
