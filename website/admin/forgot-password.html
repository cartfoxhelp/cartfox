<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CartFox Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">🔑 Forgot Password</h1>
            <p class="login-subtitle">Enter your email to receive a reset link.</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@cartfox.com">
                </div>
                <div id="message" class="success-message hidden"></div>
                <div id="error" class="error-message hidden"></div>
                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                    Send Reset Link
                    <span class="spinner hidden" id="spinner"></span>
                </button>
            </form>
            <div class="login-footer">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>
    <script>
        // API_BASE_URL is loaded from auth.js
        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const messageDisplay = document.getElementById('message');
        const errorDisplay = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;
            messageDisplay.classList.add('hidden');
            errorDisplay.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDisplay.textContent = data.message + " Check backend console for the reset token.";
                    messageDisplay.classList.remove('hidden');
                } else {
                    errorDisplay.textContent = data.message || 'An error occurred.';
                    errorDisplay.classList.remove('hidden');
                }
            } catch (error) {
                errorDisplay.textContent = 'Could not connect to the server.';
                errorDisplay.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
