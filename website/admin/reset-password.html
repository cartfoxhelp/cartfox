<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CartFox Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Mobile App Theme -->
    <meta name="theme-color" content="#111827">
    <!-- Mobile App Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="login-container">
    <div class="login-box">
        <h1 class="login-title">Set New Password</h1>
        <p class="login-subtitle">अपना नया पासवर्ड दर्ज करें।</p>

        <form id="resetPasswordForm">
            <div class="form-group password-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" required>
                <span class="password-toggle" onclick="togglePasswordVisibility('newPassword', this)">👁️</span>
                <div id="password-strength-meter" class="password-strength-meter">
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                </div>
                <p id="password-strength-text" class="password-strength-text"></p>
            </div>

            <div class="form-group password-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                 <span class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</span>
            </div>

            <button type="submit" class="btn" id="updatePasswordBtn">
                Reset Password <span class="spinner hidden" id="resetSpinner"></span>
            </button>

            <div id="error" class="error-message hidden"></div>
        </form>

        <div class="demo-credentials" style="margin-top: 25px;">
            <p>
                <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">
                    लॉगिन पेज पर वापस जाएं
                </a>
            </p>
        </div>
    </div>

    <script src="reset-password.js"></script>
</body>
</html>
